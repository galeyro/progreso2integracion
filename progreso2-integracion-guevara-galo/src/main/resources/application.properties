spring.application.name=progreso2-integracion-guevara-galo

# Server Configuration
server.port=8080

# Spring RabbitMQ Properties
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Custom Paths for File Output
citas.outbox.dir=../data/outbox
citas.outbox.filename=auditoria-citas.csv
citas.errors.dir=../data/errors
citas.errors.filename=citas-rechazadas.log
